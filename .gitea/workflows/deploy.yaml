name: Deploy Quiz MCP
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Automatically fetch the code using Gitea's built-in security token
      - name: Check out application code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Sync the files and tell the host's Docker engine to restart the app
      - name: Sync Files and Restart Container
        run: |
          # Ensure the project sub-folder exists in your mapped directory
          mkdir -p /root/gitea-runner-apps/quiz-mcp

          # Copy the code files over
          cp -R ./* /root/gitea-runner-apps/quiz-mcp/

          # Move into the directory and tell the host's Docker engine to recreate the app
          cd /root/gitea-runner-apps/quiz-mcp/
          docker compose up -d --force-recreate
