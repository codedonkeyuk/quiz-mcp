name: Continuous Deployment
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: debian-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync and Deploy Docker App
        run: |
          # 1. Grab the exact repo name dynamically (e.g. "quiz-mcp", "main-site")
          REPO_NAME="${{ github.event.repository.name }}"

          # 2. Dynamically create and sync files to that specific folder
          mkdir -p ~/apps/$REPO_NAME
          rsync -avz --delete ./ ~/apps/$REPO_NAME/

          # 3. Step inside and fire up the containers natively
          cd ~/apps/$REPO_NAME
          docker compose up -d --build --force-recreate
