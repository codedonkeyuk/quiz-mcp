name: Deploy Quiz MCP
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: debian-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync and Deploy Docker App
        run: |
          # Create your centralized workspace folder for this specific app
          mkdir -p ~/apps/quiz-mcp

          # Safely copy the repository files into the app directory
          rsync -avz --delete ./ ~/apps/quiz-mcp/

          # Navigate into the workspace and launch your docker apps
          cd ~/apps/quiz-mcp
          docker compose up -d --build --force-recreate
