name: Deploy Quiz MCP via SSH
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: debian-stable
    steps:
      - name: Sync and Restart quiz-mcp Application
        env:
          # Pulls only your passphrase from Gitea Secrets
          PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          # 1. Start the SSH agent
          eval $(ssh-agent -s)

          # 2. Unlock your local physical key file using the passphrase secret
          echo "$PASSPHRASE" | setsid ssh-add ~/.ssh/id_rsa

          # 3. Securely clone or pull using SSH
          mkdir -p ~/gitea-runner-apps/quiz-mcp
          cd ~/gitea-runner-apps/quiz-mcp

          if [ -d ".git" ]; then
            git fetch --all
            git reset --hard origin/main
          else
            git clone git@192.168.52.200:leighgordy/quiz-mcp.git .
          fi

          # 4. Restart the container
          docker compose up -d --force-recreate
