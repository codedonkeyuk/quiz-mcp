name: Deploy Quiz MCP via SSH
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: debian-stable
    steps:
      - name: Sync and Restart quiz-mcp Application
        env:
          # Pulls the secret passphrase securely from Gitea
          PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          # 1. Start the SSH Agent and import your host's SSH key using the passphrase
          eval $(ssh-agent -s)
          echo "$PASSPHRASE" | mypassword="$PASSPHRASE" expect -c '
            spawn ssh-add /home/leighgordy/.ssh/id_rsa
            expect "Enter passphrase for"
            send "$env(PASSPHRASE)\r"
            expect eof
          '

          # 2. Ensure the project folder exists
          mkdir -p ~/gitea-runner-apps/quiz-mcp
          cd ~/gitea-runner-apps/quiz-mcp

          # 3. Use SSH instead of HTTPS to clone/pull the code
          if [ -d ".git" ]; then
            git fetch --all
            git reset --hard origin/main
          else
            # Uses the standard SSH clone syntax for your local Gitea server
            git clone git@192.168.52.200:leighgordy/quiz-mcp.git .
          fi

          # 4. Restart the container
          docker compose up -d --force-recreate
