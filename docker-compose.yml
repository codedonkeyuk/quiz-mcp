services:
  quiz-tools:
    image: node:26-alpine
    container_name: quiz-mcp
    restart: always
    working_dir: /app
    volumes:
      - .:/app:ro
      - ./data:/app/data
    command: ["node", "src/index.ts"]
    networks:
      - mcp_network

networks:
  mcp_network:
    external: true
    name: mcp-tools-net
