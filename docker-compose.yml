services:
  quiz-mcp:
    image: node:26-alpine
    container_name: quiz-mcp
    restart: always
    working_dir: /app
    volumes:
      - .:/app:ro
      - quiz_tools_data:/app/data
    command: ["node", "src/index.ts"]
    networks:
      - mcp_network

volumes:
  quiz_tools_data:

networks:
  mcp_network:
    external: true
    name: mcp-tools-net
